# Vague, matching nvim/lua/custom/colors.lua, tmux/.tmux.conf and ghostty/config.
# Backgrounds use "reset" so Ghostty's translucent background shows through.
base = "ocean"
# leaf only ships syntect's built-in syntax themes; mocha is the closest muted one.
syntax = "base16-mocha.dark"

[ui]
toc_bg = "reset"
toc_border = "#252530"
content_bg = "reset"
scrollbar_hover = "#f4be7c"
status_bg = "reset"
status_separator = "#606079"
status_brand_fg = "#141415"
status_brand_bg = "#f4be7c"
status_filename_fg = "#cdcdcd"
status_filename_bg = "#252530"
status_watch_fg = "#99b782"
status_watch_bg = "#1c2118"
status_reloaded_fg = "#141415"
status_reloaded_bg = "#99b782"
status_search_fg = "#f4be7c"
