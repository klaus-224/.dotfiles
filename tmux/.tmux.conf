set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# ---- Prefix & core ----
set -g extended-keys on
set -g prefix C-a
set -g allow-passthrough on
set -g visual-activity off
set -g base-index 7
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g detach-on-destroy off
set -g focus-events on
set -g mode-keys vi

# ---- Mode & pane movement ----
setw -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind - split-window -h -c '#{pane_current_path}'

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind m resize-pane -Z

# ---- Copy mode ----
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# ---- Status bar (vague palette) ----
set -g @c_bg '#0f1117'
set -g @c_fg '#cdcdcd'
set -g @c_accent '#ffd166'
set -g @c_active '#6E94B2'
set -g @c_active_alt '#D8647E'
set -g @c_tab '#1a1b26'
set -g @c_tab_fg '#8b8fa3'
set -g @c_tab_alt '#252530'
set -g @c_warn '#f3be7c'
set -g @c_alert '#d8647e'
set -g @tab_active '#[fg=#{@c_active},bold] #I-#W'
set -g @tab_inactive '#[fg=#{@c_tab_fg}] #I-#W'
set -g @session_name '#[fg=#{@c_accent},bold]#S'

# ---- Status layout ----
set -g status-position top
set -g status-justify absolute-centre
set -g status-style 'fg=#{@c_fg},bg=#{@c_bg}'
set -g status-interval 5
set -g status-left '#S'
set -g status-right ''


# status bar
# center = session name
# left  = window tabs
set -g status-format[0] '#[align=left]#{E:@session_name}#[align=centre]#{W:#{E:@tab_inactive},#{E:@tab_active}}'
set -g monitor-activity on
set -g window-status-activity-style "fg=#{@c_warn},bg=#{@c_tab},bold"
set -g window-status-bell-style "fg=#{@c_alert},bg=#{@c_tab},reverse,bold"

# ---- Keymaps / misc ----
bind r {
  source-file "$HOME/.tmux.conf"
  refresh-client -S
  display-message 'config reloaded'
}

bind d detach-client
bind-key s new-session
bind-key w new-window
bind-key x kill-session
bind-key q kill-window
bind-key O choose-session
bind-key y switch-client -p
bind-key b switch-client -n
