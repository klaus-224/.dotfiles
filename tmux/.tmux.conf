# ---- Prefix & core ----
set -g prefix C-z
set -gq allow-passthrough on
set -g visual-activity off
set -g base-index 1
set -sg escape-time 0
set -g detach-on-destroy off

# ---- Mode & pane movement ----
setw -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

unbind '"'
unbind-key %

bind - split-window -v -c '#{pane_current_path}'

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind m resize-pane -Z

# ---- Copy mode ----
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# ---- Status bar (vague palette) ----
set -g @c_bg 'colour234'
set -g @c_fg 'colour245'
set -g @c_accent 'colour109'
set -g @c_dim 'colour237'
set -g @c_warn 'colour216'
set -g @c_alert 'colour167'

set -g pane-border-style "fg=#{@c_dim}"
set -g pane-active-border-style "fg=#{@c_accent}"

set -g status-position top
set -g status-style "fg=#{@c_fg},bg=#{@c_bg}"
set -g status-left '#[fg=#{@c_accent},bg=#{@c_bg},bold] #S #[default]'
set -g status-justify absolute-centre
set -g status-right '#[fg=#{@c_fg}]#(date +"%a %b %d %I:%M%p") '

set -g monitor-activity on
set -g window-status-separator ' | '
set -g window-status-format '#[fg=#{@c_fg},bg=#{@c_bg}] #W '
set -g window-status-current-format '#[fg=#{@c_bg},bg=#{@c_accent},bold] #W #[default]'
set -g window-status-activity-style "fg=#{@c_warn},bold"
set -g window-status-bell-style "fg=#{@c_alert},reverse"

# ---- Keymaps / misc ----
bind r {
  source-file ~/.tmux.conf
  display 'config reloaded'
}

bind d detach-client
bind-key s new-session
bind-key C-s command-prompt -p "New session name:" "new-session -s '%%'"
bind-key w new-window
bind-key C-w command-prompt -p "New window name:" "new-window -n '%%'"
bind-key x kill-session
bind-key q kill-window
bind-key O choose-session

# ---- Plugins ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'
