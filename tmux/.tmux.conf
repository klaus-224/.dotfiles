set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# ---- Prefix & core ----
set -g prefix C-z
set -g allow-passthrough on
set -g visual-activity off
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g detach-on-destroy off
set -g history-limit 10000
set -g focus-events on

# ---- Mode & pane movement ----
setw -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

unbind '"'
unbind-key %

bind - split-window -v -c '#{pane_current_path}'

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind m resize-pane -Z

# ---- Copy mode ----
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# ---- Status bar (vague palette) ----
set -g @c_bg '#0f1117'
set -g @c_fg '#cdcdcd'
set -g @c_accent '#ffd166'
set -g @c_active '#d9b76f'
set -g @c_active_alt '#b99a5b'
set -g @c_dim '#252530'
set -g @c_tab '#1a1b26'
set -g @c_tab_fg '#8b8fa3'
set -g @c_tab_alt '#23283a'
set -g @c_warn '#f3be7c'
set -g @c_alert '#d8647e'

set -g pane-border-style "fg=#{@c_dim}"
set -g pane-active-border-style "fg=#{@c_accent}"

# ---- Status layout ----
set -g status-position top
set -g status-style "fg=#{@c_fg},bg=#{@c_bg}"
set -g status-interval 2

# Let status-format[0] own the whole line.
set -g status-left ''
set -g status-right ''
set -g status-left-length 0
set -g status-right-length 0
set -g status-justify left

# Clean tab blocks:
# - inactive tabs use muted blue-gray
# - active tab uses muted amber with a subtle split between index and title
# - spaces between tabs keep the bar readable without chunky powerline arrows
set -g @tab_inactive '#[fg=#{@c_tab_fg},bg=#{@c_tab_alt}] #I #[fg=#{@c_fg},bg=#{@c_tab}] #W #[fg=#{@c_bg},bg=#{@c_bg}] '
set -g @tab_active '#[fg=#{@c_bg},bg=#{@c_active_alt},bold] #I #[fg=#{@c_bg},bg=#{@c_active},bold] #W #[fg=#{@c_bg},bg=#{@c_bg}] '


# muxbar is used only for the stats segment.
# Configure muxbar's Rust config to output only CPU/memory/battery/etc.
set -g @system_stats '#(if command -v muxbar >/dev/null 2>&1; then muxbar; fi)'

# Full-width status line:
# left  = window tabs
# right = session dots + system stats + clock
set -g status-format[0] '#[align=left]#{W:#{E:@tab_inactive},#{E:@tab_active}}#[align=right]#{E:@system_stats} #[fg=#{@c_fg},bg=#{@c_bg}]%a %b %d %I:%M%p '

set -g monitor-activity on
set -g window-status-activity-style "fg=#{@c_warn},bg=#{@c_tab},bold"
set -g window-status-bell-style "fg=#{@c_alert},bg=#{@c_tab},reverse,bold"

# ---- Keymaps / misc ----
bind r {
  source-file ~/.tmux.conf
  refresh-client -S
  display-message 'config reloaded'
}

bind d detach-client
bind-key S new-session
bind-key W new-window
bind-key x kill-session
bind-key q kill-window
bind-key O choose-tree
bind-key h switch-client -p

# ---- Plugins ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'

