set-option -g focus-events on
set -g terminal-features "tmux-256color"
set -g extended-keys on
set -g prefix C-a
set -g base-index 7
set -g renumber-windows on   
set -g mode-keys vi
set -g detach-on-destroy off
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind | split-window -h -l 33% -c '#{pane_current_path}'
bind > split-window -h -l 33% -c '#{pane_current_path}' opencode
bind m resize-pane -Z
bind-key - resize-pane -L 5
bind-key = resize-pane -R 5
# Bind 'v' to begin selection (like Vim)
bind -T copy-mode-vi v send-keys -X begin-selection
# Bind 'y' to yank text to the system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# ---- Status bar (vague palette) ----
set -g @c_bg '#252530'
set -g @c_fg '#cdcdcd'
set -g @c_accent '#f4be7c'
set -g @c_active '#6E94B2'
set -g @c_tab '#1a1b26'
set -g @c_tab_fg '#8b8fa3'
set -g @c_warn '#f3be7c'
set -g @c_alert '#d8647e'
 
set -g @tab_active ' #[fg=#{@c_active},bold] #I:#W*'
set -g @tab_inactive ' #[fg=#{@c_tab_fg}] #I:#W'
set -g @session_name '#[fg=#{@c_accent},bold]#S'

# ---- Status layout ----
set -g status-position top
set -g status-style 'fg=#{@c_fg},bg=#{@c_bg}'
set -g status-interval 5
set -g status-format[0] ' #[align=left]#{E:@session_name}  #{W:#{?window_active,#{E:@tab_active},#{E:@tab_inactive}}}'
set -g monitor-activity on
set -g window-status-activity-style "fg=#{@c_warn},bg=#{@c_tab},bold"
set -g window-status-bell-style "fg=#{@c_alert},bg=#{@c_tab},reverse,bold"

# ---- Keymaps / misc ----
bind r {
  source-file "$HOME/.tmux.conf"
  refresh-client -S
  display-message 'config reloaded'
}

unbind b
bind x kill-window
bind w neww
bind-key O choose-session
bind g run "~/.dotfiles/scripts/open-github.sh"
bind C run "~/.dotfiles/scripts/tmux-session-dispensary.sh ~/code"
bind D run "~/.dotfiles/scripts/tmux-session-dispensary.sh ~/.dotfiles"
bind N run "~/.dotfiles/scripts/tmux-session-dispensary.sh ~/.dotfiles/nvim/.config/nvim"
bind S run "~/.dotfiles/scripts/tmux-session-dispensary.sh ~/code/sandbox"

bind ] switch-client -n

unbind k
unbind T
bind G neww -n "git" -S lazygit
bind P neww -n "journal" -S journal
bind E show-environment -g
