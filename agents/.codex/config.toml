## ##############################################################################
# Core Model
## ##############################################################################

model = "gpt-5.4"
model_provider = "openai"
personality = "friendly"
model_reasoning_effort = "high"

## ##############################################################################
# Features
## ##############################################################################

[features]
multi_agent = true
apps = true

## ##############################################################################
# Agents
## ##############################################################################

[agents]
max_threads = 8
max_depth = 3

[agents.explorer]
description = "Explores and maps the repository architecture"
config_file = "~/.dotfiles/agents/.codex/agents/explorer/config.toml"

[agents.planner]
description = "Creates structured implementation plans for coding and testing tasks"
config_file = "~/.dotfiles/agents/.codex/agents/planner/config.toml"

[agents.implementer]
description = "Executes implementation plans — coding changes or manual testing with Playwright"
config_file = "~/.dotfiles/agents/.codex/agents/implementer/config.toml"

[agents.reviewer]
description = "Reviews code changes for smells and correctness, or test reports for validity"
config_file = "~/.dotfiles/agents/.codex/agents/reviewer/config.toml"

## ##############################################################################
# UI
## ##############################################################################

[tui]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "model-name",
  "git-branch",
  "context-remaining"
]
theme = "1337"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

## ##############################################################################
# Misc
## ##############################################################################

[analytics]
enabled = false

[feedback]
enabled = false
