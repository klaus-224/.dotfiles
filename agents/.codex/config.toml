## ##############################################################################
# Core Model
## ##############################################################################

model = "gpt-5.3-codex-spark"
model_provider = "openai"
personality = "pragmatic"
model_reasoning_effort = "high"

## ##############################################################################
# Features
## ##############################################################################

[features]
multi_agent = true
apps = true

## ##############################################################################
# Profiles
## ##############################################################################

[profiles.repo-explorer]
model = "gpt-5.4"
model_reasoning_effort = "high"
approval_policy = "on-request"
model_instructions_file = "~/.dotfiles/agents/.codex/agents/repo-explorer/instruction.md"

