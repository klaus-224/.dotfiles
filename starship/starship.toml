format = """
$aws$mise$username$hostname$directory$git_branch$git_status$fill$nodejs$rust$python
$character
"""
add_newline = false
palette = "clean"

[palettes.clean]
fg = "#cdcdcd"
muted = "#606079"
blue = "#6e94b2"
green = "#99b782"
yellow = "#e8b589"
red = "#c48282"
lavender = "#c9b1ca"
cyan = "#78a8ad"
teal = "#7fa89a"
orange = "#d99a78"
pink = "#c996a5"
purple = "#a993bd"

[fill]
symbol = " "

[mise]
disabled = false
format = "[$symbol]($style)"
symbol = "󰏗 "
style = "bold purple"

[username]
show_always = true
format = "[$user]($style) "
style_user = "bold yellow"

[hostname]
ssh_only = false
disabled = false
detect_env_vars = ["!TMUX", "SSH_CONNECTION"]
format = "@[$hostname]($style) "
style = "bold blue"

[directory]
style = "bold fg"
truncate_to_repo = false
truncation_length = 999
format = "[$path]($style)"
home_symbol = "~"

[git_branch]
symbol = ""
style = "bold green"
format = " [$branch]($style)"

[git_status]
style = "bold yellow"
format = " ([$all_status$ahead_behind]($style) )"
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"

[nodejs]
symbol = ""
style = "bold green"
format = "[node:$version]($style) "

[rust]
symbol = ""
style = "bold red"
format = "[rust:$version]($style) "

[python]
symbol = ""
style = "bold yellow"
format = "[py:$version]($style) "

[aws]
symbol = ""
style = "bold orange"
format = "[aws:$profile]($style) "

[aws.profile_aliases]
Enterprise_Naming_Scheme-voidstars = "void**"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
