"$schema" = "https://starship.rs/config-schema.json"
format = """
$username$hostname$os$directory$git_branch$git_status$fill$nodejs$rust$python$aws
$character
"""
add_newline = false

[palettes.clean]
fg = "#cdcdcd"
muted = "#606079"
blue = "#8ba9c1"
green = "#99b782"
yellow = "#f5cb96"
red = "#e08398"
lavender = "#c9b1ca"

[fill]
symbol = " "

[username]
show_always = true
format = "[$user]($style)@ "

[hostname]
ssh_only = true
format = "[$hostname]($style) "

[os]
disabled = false
format = "[$symbol]($style)"
style = "bold #cdd6f4"

[os.symbols]
Alpine = ""
Amazon = ""
Android = ""
Arch = ""
Debian = ""
Fedora = ""
Linux = ""
Macos = " "
Ubuntu = ""
Windows = ""

[directory]
style = "bold fg"
truncate_to_repo = false
truncation_length = 999
format = "[$path]($style)"
home_symbol = "~"

[git_branch]
symbol = ""
style = "bold #a6e3a1"
format = " [$branch]($style)"

[git_status]
style = "bold #f9e2af"
format = " ([$all_status$ahead_behind]($style) )"
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"

[nodejs]
symbol = ""
style = "#89b4fa"
format = "[node:$version]($style) "

[rust]
symbol = ""
style = "#f38ba8"
format = "[rust:$version]($style) "

[python]
symbol = ""
style = "#f9e2af"
format = "[py:$version]($style) "

[aws]
symbol = ""
style = "#ff964f"
format = "[aws:$profile]($style)"
force_display = false
disabled = false

[shell]
disabled = false
format = "[$indicator]($style)"
style = "muted"

[character]
success_symbol = "[❯](#a6e3a1)"
error_symbol = "[❯](#f38ba8)"
