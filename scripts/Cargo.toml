[package]
name = "dotfiles-scripts"
version = "0.1.0"
edition = "2024"
publish = false

# Each file in src/bin/ becomes a binary of the same name.
# Install them into ~/.local/bin with `just install-scripts`.

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
strip = true
