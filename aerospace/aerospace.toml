config-version = 2
start-at-login = true
auto-reload-config = true

after-startup-command = ["exec-and-forget borders active_color=0xffe8b589 inactive_color=0xffcdcdcd width=2"]
exec-on-workspace-change = ["/bin/bash", "-c", "/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change \"FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE\""]

default-root-container-layout = "tiles"
default-root-container-orientation = "auto"
on-focused-monitor-changed = ["move-mouse monitor-lazy-center"]
automatically-unhide-macos-hidden-apps = false
focus-follows-mouse.enabled = false

persistent-workspaces = [
  "code-main",
  "code-secondary",
  "browse-main",
  "browse-secondary",
  "music",
  "slack",
  "discord",
  "teams",
  "teams-call",
]

[workspace-to-monitor-force-assignment]
code-main = "main"
code-secondary = "secondary"
browse-main = "main"
browse-secondary = "secondary"
music = "secondary"
slack = "secondary"
discord = "secondary"
teams = "secondary"
teams-call = "main"

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.right = 8
outer.top = [{ monitor."built-in" = 10 }, { monitor."main" = 44 }, 44]

[mode.main.binding]
alt-tab = "focus-monitor --wrap-around next"
alt-slash = "layout tiles horizontal vertical"
alt-comma = "layout accordion horizontal vertical"
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"

alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"

alt-1 = 'exec-and-forget /bin/bash -lc "$HOME/.dotfiles/scripts/aerospace-groups.sh code"'
alt-2 = 'exec-and-forget /bin/bash -lc "$HOME/.dotfiles/scripts/aerospace-groups.sh browse"'
alt-3 = 'exec-and-forget /bin/bash -lc "$HOME/.dotfiles/scripts/aerospace-groups.sh slack"'
alt-4 = 'exec-and-forget /bin/bash -lc "$HOME/.dotfiles/scripts/aerospace-groups.sh teams"'
alt-5 = 'exec-and-forget /bin/bash -lc "$HOME/.dotfiles/scripts/aerospace-groups.sh music"'

# Vim-like resizing
alt-cmd-h = "resize width -25"
alt-cmd-j = "resize height +25"
alt-cmd-k = "resize height -25"
alt-cmd-l = "resize width +25"

[[on-window-detected]]
if.app-id = "com.mitchellh.ghostty"
run = "move-node-to-workspace code-main"

[[on-window-detected]]
if.app-id = "com.spotify.client"
run = "move-node-to-workspace music"

[[on-window-detected]]
if.app-id = "com.tinyspeck.slackmacgap"
run = "move-node-to-workspace slack"

[[on-window-detected]]
if.app-id = "com.hnc.Discord"
run = "move-node-to-workspace discord"
