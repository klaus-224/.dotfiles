config-version = 2
start-at-login = true
auto-reload-config = true

after-startup-command = [
  # JankyBorders has a built-in detection of already running process,
  # so it won't be run twice on AeroSpace restart
  "exec-and-forget borders active_color=0xffc9b1ca inactive_color=0xffcdcdcd width=5.0"
]
exec-on-workspace-change = ["/bin/bash", "-c", "/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change \"FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE\""]

default-root-container-layout = "tiles"
default-root-container-orientation = "auto"
on-focused-monitor-changed = ["move-mouse monitor-lazy-center"]
automatically-unhide-macos-hidden-apps = false
focus-follows-mouse.enabled = false

persistent-workspaces = ["1", "2", "3", "4", "5"]

[workspace-to-monitor-force-assignment]
1 = ["main", "built-in"]
2 = ["main", "built-in"]
3 = ["secondary", "built-in"]
4 = ["secondary", "built-in"]
5 = ["secondary", "built-in"]

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 12
outer.bottom = 12
outer.right = 12
outer.top = [{ monitor."built-in" = 10 }, { monitor."main" = 48 }, 44]

[mode.main.binding]
alt-tab = "focus-monitor --wrap-around next"
alt-slash = "layout tiles horizontal vertical"
alt-comma = "layout accordion horizontal vertical"
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"

alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"

alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"

alt-shift-1 = "move-node-to-workspace 1"
alt-shift-2 = "move-node-to-workspace 2"
alt-shift-3 = "move-node-to-workspace 3"
alt-shift-4 = "move-node-to-workspace 4"
alt-shift-5 = "move-node-to-workspace 5"

# Vim-like resizing
alt-cmd-h = "resize width -25"
alt-cmd-j = "resize height +25"
alt-cmd-k = "resize height -25"
alt-cmd-l = "resize width +25"

[[on-window-detected]]
if.app-id = "com.mitchellh.ghostty"
run = "move-node-to-workspace 1"

[[on-window-detected]]
if.app-id = "com.thebrowser.Browser"
run = "move-node-to-workspace 2"

[[on-window-detected]]
if.app-id = "com.spotify.client"
run = "move-node-to-workspace 3"

[[on-window-detected]]
if.app-id = "come.tinyspeck.slackmacgap"
run = "move-node-to-workspace 4"
