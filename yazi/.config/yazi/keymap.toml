# reference: https://yazi-rs.github.io/docs/configuration/keymap
# default: https://github.com/sxyazi/yazi/blob/shipped/yazi-config/preset/keymap-default.toml
"$schema" = "https://yazi-rs.github.io/schemas/keymap.json"

[mgr]
prepend_keymap = [
  # unbinds
  { on = "<space>", run = "noop", desc = "Disabled" },
  { on = "q", run = "noop", desc = "Disabled" },
  { on = "Q", run = "noop", desc = "Disabled" },
  { on = ["c", "c"], run = "noop", desc = "Disabled" },
  { on = ["c", "d"], run = "noop", desc = "Disabled" },
  { on = ["c", "f"], run = "noop", desc = "Disabled" },
  { on = ["c", "n"], run = "noop", desc = "Disabled" },
  { on = ["g", "h"], run = "noop", desc = "Disabled" },
  { on = ["g", "c"], run = "noop", desc = "Disabled" },
  { on = ["g", "d"], run = "noop", desc = "Disabled" },
  { on = "s", run = "noop", desc = "Disabled" },
  { on = "S", run = "noop", desc = "Disabled" },
  { on = "v", run = "noop", desc = "Disabled" },
  { on = "Y", run = "noop", desc = "Disabled" },
  # overrides
  { on = "V", run = "visual_mode", desc = "Enter visual mode" },
  { on = "<Esc>", run = [
    "escape",
    "escape --search",
    "visual_mode --unset",
    "unyank"
  ], desc = "Exit visual mode, clear selection, or cancel search" },
  { on = ["<Space>", "Q"], run = "quit", desc = "Quit the process" },
  { on = ["<Space>", "f", "f"], run = "search --via=fd", desc = "Search files by name via fd" },
  { on = ["<Space>", "f", "g"], run = "search --via=rg", desc = "Search files by content via ripgrep" },
  # goto overrides
  { on = ["<Space>", "c", "h"], run = "cd ~", desc = "go home" },
  { on = ["<Space>", "c", "d"], run = "cd ~/.dotfiles", desc = "go to ~/.dotfiles" },
  { on = ["<Space>", "c", "c"], run = "cd ~/code", desc = "go to ~/code" },
  { on = ["<Space>", "c", "D"], run = "cd ~/Downloads", desc = "go to ~/Downloads/" },
  { on = ["<Space>", "c", "u"], run = "cd ~/Documents/user-data/", desc = "go to user-data/" },
  { on = ["<Space>", "c", "s"], run = "cd ~/Documents/screen-shots/", desc = "go to screen-shots/" },
  # plugin smart enter
  { on = "<Enter>", run = "plugin smart-enter", desc = "Enter directory or open file" },
  { on = "o", run = "plugin open-in-nvim", desc = "Open in nvim" },
  # plugin duckdb
  { on = "H", run = "plugin duckdb -1", desc = "Scroll one column to the left" },
  { on = "L", run = "plugin duckdb +1", desc = "Scroll one column to the right" },
  { on = ["g", "o"], run = "plugin duckdb -open", desc = "open with duckdb" },
  { on = ["g", "u"], run = "plugin duckdb -ui", desc = "open with duckdb ui" },
  # plugin system clipboard
  { on = ["<Space>", "y", "p"], run = "plugin system-clipboard path", desc = "Copy file path to clipboard" },
  { on = ["<Space>", "y", "d"], run = "plugin system-clipboard dirname", desc = "Copy directory path to clipboard" },
  { on = ["<Space>", "y", "y"], run = "plugin system-clipboard filename", desc = "Copy filename to clipboard" },
  { on = ["<Space>", "y", "n"], run = "plugin system-clipboard name_without_ext", desc = "Copy filename without extension to clipboard" },
  { on = "Y", run = "plugin system-clipboard file", desc = "Copy file to system clipboard (paste in Finder/Nautilus/browser)" },
]

[input]
prepend_keymap = [{ on = "<Esc>", run = "close", desc = "Cancel input" }]
